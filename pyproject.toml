[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = "^0.141.1"}
uvicorn = {extras = ["standard"], version = "^0.52.4"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.52"}
asyncpg = "^0.31.0"
alembic = "^1.19.1"
pyjwt = "^2.13.0"
pwdlib = {extras = ["argon2"], version = "^0.3.1"}

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)"
]
